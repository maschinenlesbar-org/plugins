# Deutsche Oberflächentexte. Gleiche Schlüssel wie en.yml (sonst bricht der Build ab).
# `categories` und `plugins` dürfen lückenhaft sein: Fehlendes fällt auf den englischen
# Text aus dem Marketplace zurück, und der Build meldet es als Warnung.
# Ändert sich eine englische Plugin-Beschreibung in marketplace.json, hier nachziehen.

name: Deutsch

site:
  title: maschinenlesbar.org Plugins
  description: >-
    Claude-Code-Plugins für offene APIs aus Staat und Verwaltung in Deutschland – Parlament,
    Statistik, Wetter, Pegelstände, Energie, Warnungen und mehr, jeweils mit einer CLI von
    maschinenlesbar.org.

nav:
  label: Hauptnavigation
  plugins: Plugins
  install: Installation
  github: GitHub
  language: Sprache
  skip: Zum Inhalt springen

hero:
  eyebrow: Plugin-Marketplace für Claude Code
  title: Offene Daten aus Staat und Verwaltung – direkt in Claude
  intro: >-
    %plugins% Plugins mit %skills% Skills bringen Claude bei, die Kommandozeilen-Werkzeuge
    von maschinenlesbar.org zu nutzen – für Bundestag und Bundesrat, amtliche Statistik,
    Wetter und Pegelstände, Energie, Warnungen, Stellenangebote und mehr.

install:
  title: Installation
  step1_title: Marketplace hinzufügen
  step1_text: "Einmalig in Claude Code:"
  step2_title: CLI installieren
  step2_text: >-
    Jedes Plugin steuert eine CLI, die Sie selbst installieren. Die Skills prüfen, ob sie
    im PATH liegt, und installieren nie etwas.
  step3_title: Plugin installieren
  step3_text: Dann einfach fragen – Claude wählt den passenden Skill.
  note: >-
    Einige APIs benötigen einen kostenlosen Schlüssel oder ein Konto; die Seite des
    jeweiligen Plugins verweist auf die Voraussetzungen. Beim Installieren kopiert Claude
    Code das Repository der CLI und führt dort <code>npm ci --ignore-scripts</code> aus
    (etwa 35 MB) – die Skills nutzen diese Pakete nicht, sondern die von Ihnen installierte
    CLI. Neue Versionen holen Sie mit <code>/plugin marketplace update %name%</code>.

