teams:
  title: For a team or project
  text: >-
    Commit this to a project's <code>.claude/settings.json</code> to register the
    marketplace and enable plugins for everyone working in it:

data:
  title: The tool, not the data
  text: >-
    The data comes from the public bodies behind each API, under their own terms — public
    domain, attribution licences or custom provider terms — documented in
    <code>DATA_LICENSE.md</code> in each plugin's repository. The plugins and CLIs are
    dual-licensed AGPL-3.0-or-later or commercial.

