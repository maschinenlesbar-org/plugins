# English interface strings. Every language file must have the same keys (the
# build fails otherwise), except `categories` and `plugins`, which may be partial:
# a missing entry falls back to the English text from the marketplace.
# Placeholders like %name% are filled in by the templates.

name: English

site:
  title: maschinenlesbar.org plugins
  # The home page's <title>.
  home_title: "Claude Code plugins for German public-sector APIs — maschinenlesbar.org"
  description: >-
    Claude Code plugins for open German public-sector APIs — parliament, statistics,
    weather, water levels, energy, warnings and more, each driving a maschinenlesbar.org CLI.

nav:
  label: Main
  plugins: Plugins
  install: Install
  mcp: MCP
  github: GitHub
  language: Language
  skip: Skip to content

hero:
  eyebrow: Claude Code plugin marketplace
  title: Ask Claude about Germany's open public-sector data
  intro: >-
    %plugins% plugins with %skills% skills teach Claude to use the maschinenlesbar.org
    command-line tools — for the Bundestag and Bundesrat, official statistics, weather and
    water levels, energy, public warnings, jobs and more. Every tool also comes as an MCP
    server, for Claude and any other MCP client.

install:
  title: Install
  step1_title: Add the marketplace
  step1_text: "Once, inside Claude Code:"
  step2_title: Install the CLI
  step2_text: >-
    Each plugin drives a CLI you install yourself. Skills check it's on your PATH and
    never install anything.
  step3_title: Install the plugin
  step3_text: Then just ask — Claude picks the right skill.
  note: >-
    A few APIs need a free key or account; each plugin's page links to its requirements.
    Installing a plugin copies its CLI repository and runs <code>npm ci --ignore-scripts</code>
    there (about 35 MB) — the skills don't use those packages, they call the CLI you
    installed. Pick up new releases with <code>/plugin marketplace update %name%</code>.

catalogue:
  title: Plugins
  meta: "%skills% skills · <code>%bin%</code> CLI"
  mcp: MCP server

filter:
  placeholder: Filter by name, topic or API…
  search_label: Filter plugins
  category_label: Category
  all: All
  total_format: "%total% plugins"
  count_format: "%visible% of %total% plugins"
  empty: No plugin matches.

mcp:
  title: MCP servers
  text: >-
    Every API also has an MCP server: the same commands as MCP tools, built on the same
    client as the CLI. Use it from Claude Code, Claude Desktop or any other MCP client.
    Install one from npm and add it to Claude Code:
  image: "Or run it as a container image instead, with nothing installed but Docker:"
  note: >-
    Each plugin's page shows the commands for its server. The images on
    <code>ghcr.io</code> are multi-arch, with signed provenance; each GitHub release carries
    the SBOMs, and releases can't be changed after they are published.

copy:
  label: Copy
  copied: Copied
  failed: Copying failed — select the text instead.

teams:
  title: For a team or project
  text: >-
    Commit this to a project's <code>.claude/settings.json</code> to register the
    marketplace and enable plugins for everyone working in it:

data:
  title: The tool, not the data
  text: >-
    The data comes from the public bodies behind each API, under their own terms — public
    domain, attribution licences or custom provider terms — documented in
    <code>DATA_LICENSE.md</code> in each plugin's repository. The plugins, CLIs and MCP
    servers are dual-licensed AGPL-3.0-or-later or commercial.

plugin:
  breadcrumb: Breadcrumb
  install_cli: "Install the <code>%bin%</code> CLI:"
  add_marketplace: "Add the marketplace (once):"
  install_plugin: "Install the plugin:"
  requirements: Requirements such as API keys or accounts are listed in <a href="%url%">SKILLS.md</a>.
  mcp_title: MCP server
  mcp_intro: >-
    The same commands as MCP tools, for Claude Code or any other MCP client, without the
    plugin or the CLI.
  mcp_install: "Install the <code>%bin%</code> server:"
  mcp_add: "Add it to Claude Code:"
  mcp_image: "Or run the container image instead:"
  mcp_note: >-
    Other clients, the HTTP transport, the options and any credentials are described in
    <a href="%url%">MCP.md</a>.
  mcp_server: MCP server
  container_image: Container image
  skills_title: Skills
  skills_note: ""
  details_title: Details
  repository: Repository
  cli: CLI
  command: command
  version: Plugin version
  from_tag: from tag
  license: License
  data_terms: Data terms
  keywords: Keywords

# For search engines and link previews: the Open Graph locale, and the alt text of the
# preview image, which the organisation website serves (assets/img/social-<lang>.png).
meta:
  locale: en_US
  image_alt: "maschinenlesbar.org: German public-sector information, searchable and machine-readable."

notfound:
  title: Page not found
  text: >-
    There is no plugin page at this address. The plugin may have been renamed, or the link
    may have a typo in it.
  home: All plugins
  org: maschinenlesbar.org

footer:
  marketplace: >-
    A <a href="https://code.claude.com/docs/en/plugin-marketplaces">Claude Code plugin
    marketplace</a> by <a href="%org_url%">maschinenlesbar.org</a>
  license: AGPL-3.0-or-later or commercial
  tagline: The plugins provide the tool, not the data — each API's data has its own terms.

