title: maschinenlesbar.org plugins
description: >-
  Claude Code plugins for open German public-sector APIs — parliament, statistics,
  weather, water levels, energy, warnings and more, each driving a maschinenlesbar.org CLI.
url: https://maschinenlesbar-org.github.io
baseurl: /plugins
repository: maschinenlesbar-org/plugins
org_url: https://maschinenlesbar-org.github.io/

# Read by _plugins/marketplace.rb.
marketplace:
  manifest: ../.claude-plugin/marketplace.json
  cache: .cache/repos

# Every language gets the full site; strings live in _data/i18n/<lang>.yml.
# The default language is served at the root, the others under /<lang>/.
languages: [en, de]
default_lang: en

defaults:
  - scope:
      path: ""
    values:
      lang: en

markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - components
  - scripts
  - vendor
  - README.md
