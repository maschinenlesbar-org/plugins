name: Pages

# Builds the marketplace website from site/ with Jekyll and deploys it to GitHub
# Pages (https://maschinenlesbar.org/plugins/). The banira components
# are smoke-tested, linted and compiled, Fylgja's stylesheets are vendored from
# npm, and one page per plugin is generated from .claude-plugin/marketplace.json
# by cloning each plugin's repository at its pinned tag. Nothing is committed:
# the site is assembled here and published as a Pages artifact.
#
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions".
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege at the workflow level: only read. The Pages/OIDC write scopes
# are granted per-job, to the deploy job that actually needs them.
permissions:
  contents: read

# Allow one in-flight Pages deployment at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # No dependency caches in a job whose output gets deployed.
          package-manager-cache: false

      - name: Use Ruby 3.4
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          working-directory: site
          bundler-cache: false

      - name: Install
        run: |
          npm ci
          bundle install

      - name: Test components (banira test + lint)
        run: npm test

      - name: Build assets (Fylgja CSS, banira components)
        run: npm run build:assets

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Scopes the Pages deploy needs, granted only to this job.
    permissions:
      pages: write # publish the uploaded artifact as the Pages site
      id-token: write # OIDC token deploy-pages exchanges for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
