name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the checks only read this repo and the public plugin repos.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          # The check compares moved refs against the previous marketplace (HEAD^).
          fetch-depth: 2

      - name: Use Node.js 24.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.x

      # Pinned: the validator's rules change between Claude Code releases.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.236

      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

      - name: Check plugins at their pinned tags
        run: node scripts/check-plugins.mjs
