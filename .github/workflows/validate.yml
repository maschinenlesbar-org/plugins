name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the checks only read this repo and the public plugin repos.
permissions:
  contents: read

# One run per branch or PR: a newer push supersedes the in-flight run.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketplace and plugins
    runs-on: ubuntu-latest

    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      # Installed from tools/validate/ below; check-plugins.mjs reads it too.
      CLAUDE_BIN: ${{ github.workspace }}/tools/validate/node_modules/.bin/claude

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          # The check compares moved refs against the previous marketplace (HEAD^).
          fetch-depth: 2

      - name: Use Node.js 24.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.x

      # Pinned: the validator's rules change between Claude Code releases. The
      # lockfile in tools/validate/ pins the package and its platform binaries
      # with integrity hashes, instead of an ad-hoc global install.
      - name: Install Claude Code
        run: npm ci --prefix tools/validate

      - name: Validate marketplace manifest
        run: '"$CLAUDE_BIN" plugin validate --strict .'

      - name: Check plugins at their pinned tags
        run: node scripts/check-plugins.mjs
